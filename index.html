<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Guide for the Recently Deceased</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRSqBMY=" crossorigin="" />
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              serif: ['Cinzel', 'serif'],
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              'grave-dark': '#000000',
              'grave-card': '#09090b', /* Zinc 950 */
              'goth-white': '#fafafa', /* Zinc 50 */
              'bone': '#a1a1aa', /* Zinc 400 */
              'goth-border': '#27272a', /* Zinc 800 */
            },
            animation: {
              'fog-flow': 'fog 60s linear infinite',
              'mist-rise': 'mistRise 10s ease-in-out infinite alternate',
              'flicker-glow': 'flickerGlow 4s infinite',
              'ghost-pulse': 'ghostPulse 3s ease-in-out infinite',
              'scanline': 'scanline 8s linear infinite',
              'glitch-text': 'glitch 2s infinite',
            },
            keyframes: {
              fog: {
                '0%': { transform: 'translateX(0) opacity(0.2)' },
                '50%': { transform: 'translateX(-25%) opacity(0.4)' },
                '100%': { transform: 'translateX(0) opacity(0.2)' },
              },
              mistRise: {
                '0%': { transform: 'translateY(0) scale(1)', opacity: '0.3' },
                '100%': { transform: 'translateY(-10%) scale(1.1)', opacity: '0.6' },
              },
              flickerGlow: {
                 '0%, 100%': { opacity: '0.5' },
                 '50%': { opacity: '1' },
                 '25%': { opacity: '0.7' },
                 '75%': { opacity: '0.8' },
              },
              ghostPulse: {
                '0%, 100%': { opacity: '0.4' },
                '50%': { opacity: '0.8' },
              },
              scanline: {
                '0%': { transform: 'translateY(-100%)' },
                '100%': { transform: 'translateY(100%)' },
              },
              glitch: {
                '0%': { transform: 'translate(0)' },
                '20%': { transform: 'translate(-2px, 2px)' },
                '40%': { transform: 'translate(-2px, -2px)' },
                '60%': { transform: 'translate(2px, 2px)' },
                '80%': { transform: 'translate(2px, -2px)' },
                '100%': { transform: 'translate(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        /* Spacing System */
        --space-xs: 0.5rem;
        --space-sm: 1rem;
        --space-md: 1.5rem;
        --space-lg: 2rem;
        --space-xl: 3rem;
        
        /* Layout */
        --container-max-width: 1400px;
        --card-radius: 0.25rem;
        
        /* Colors */
        --color-bg-main: #000000;
        --color-bg-card: #09090b;
        --color-border: #27272a;
        --color-border-active: #52525b;
        --color-text-primary: #e4e4e7;
        --color-text-secondary: #a1a1aa;
        
        /* Effects */
        --ghost-glow: 0 0 20px rgba(255, 255, 255, 0.07);
        --ghost-glow-active: 0 0 25px rgba(255, 255, 255, 0.15);
      }

      @media (max-width: 768px) {
        :root {
          --space-md: 1rem;
          --space-lg: 1.5rem;
          --space-xl: 2rem;
          --container-max-width: 100%;
        }
      }

      body {
        background-color: var(--color-bg-main);
        color: var(--goth-white);
        overflow-x: hidden;
      }
      
      /* Spooky Background with Vignette and Noise */
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        z-index: -1;
      }

      body::after {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        background: radial-gradient(circle at center, transparent 0%, #000000 95%);
        z-index: -1;
      }
      
      /* Fog Effect */
      .fog-layer {
        position: fixed;
        top: 0;
        left: 0;
        width: 200%;
        height: 100%;
        background: linear-gradient(to right, transparent 0%, rgba(255, 255, 255, 0.05) 50%, transparent 100%);
        z-index: -2;
        pointer-events: none;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #000000; 
      }
      ::-webkit-scrollbar-thumb {
        background: #52525b; 
        border-radius: 0px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #71717a; 
      }
      .leaflet-container {
        background: #000000;
        filter: grayscale(100%) contrast(1.2);
      }
      .leaflet-tooltip.custom-ghost-tooltip {
        background-color: rgba(10, 10, 10, 0.9);
        border: 1px solid #3f3f46;
        color: #e4e4e7;
        font-family: 'Cinzel', serif;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        padding: 4px 8px;
        font-size: 0.75rem;
        box-shadow: 0 0 10px rgba(0,0,0,0.5);
        border-radius: 2px;
      }
      .leaflet-tooltip-left::before { border-left-color: rgba(10, 10, 10, 0.9); }
      .leaflet-tooltip-right::before { border-right-color: rgba(10, 10, 10, 0.9); }
      .leaflet-tooltip-top::before { border-top-color: rgba(10, 10, 10, 0.9); }
      .leaflet-tooltip-bottom::before { border-bottom-color: rgba(10, 10, 10, 0.9); }
      
      /* Selection Color */
      ::selection {
        background: #ffffff;
        color: #000000;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.37.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-icons/gi": "https://esm.sh/react-icons@5.4.0/gi?external=react",
    "react-icons/tb": "https://esm.sh/react-icons@5.4.0/tb?external=react",
    "leaflet": "https://esm.sh/leaflet@1.9.4",
    "react-icons/": "https://esm.sh/react-icons@^5.5.0/"
  }
}
</script>
</head>
  <body>
    <div class="fog-layer animate-fog-flow"></div>
    <div id="root"></div>
  </body>
</html>
